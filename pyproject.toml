[project]
name = "scp-production"
version = "0.1.0"
description = "Production planning, worker execution, and quality control application"
requires-python = ">=3.11"
dependencies = [
  "alembic",
  "fastapi",
  "httpx",
  "openpyxl",
  "pillow",
  "psycopg2-binary",
  "pypdf",
  "python-dotenv",
  "python-multipart",
  "reportlab",
  "sqlalchemy>=2.0",
  "uvicorn",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]
